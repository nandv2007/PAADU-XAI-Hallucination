[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paadu-xai-hallucination-research"
version = "1.0.0"
description = "Scientific Research Framework for Evaluating XAI Faithfulness and Hallucination Mitigation in Network Intrusion Detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Senior AI Research Engineer", email = "research@antigravity.internal" }
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "networkx>=3.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "sentencepiece>=0.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unified_integration*", "experiments*", "evaluation*"]
